<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pink Desert</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e0cacb; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas.drag { cursor: grabbing; }
  #chatIn, #bubble { position: fixed; left: 0; top: 0; display: none; z-index: 10; transform: translate(-50%, -100%); font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; box-sizing: border-box; }
  #chatIn { width: min(330px, 84vw); padding: 10px; background: rgba(255,255,255,.88); border-radius: 18px; box-shadow: 0 6px 18px rgba(0,0,0,.25); backdrop-filter: blur(4px); }
  #chatIn .row { display: flex; gap: 8px; }
  #chatText { flex: 1; min-width: 0; font-size: 15px; padding: 8px 12px; border: 1px solid #ddd; border-radius: 999px; outline: none; }
  #chatSend { flex: none; padding: 8px 16px; border: 0; border-radius: 999px; background: #27a9b8; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  #chatCount { text-align: right; font-size: 12px; color: #666; margin: 4px 6px 0 0; }
  #bubble { max-width: min(270px, 72vw); padding: 12px 16px; background: rgba(255,255,255,.93); border-radius: 18px; box-shadow: 0 6px 18px rgba(0,0,0,.22); color: #333; font-size: 15px; line-height: 1.45; cursor: pointer; }
  #bubbleText { display: block; white-space: pre-wrap; word-break: break-word; }
  #bubble::after { content: ""; position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); border: 10px solid transparent; border-bottom: 0; border-top-color: rgba(255,255,255,.93); }
  #bubbleX { display: none; position: absolute; top: -11px; right: -11px; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 50%; background: #555; color: #fff; font-size: 17px; line-height: 26px; text-align: center; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  #bubble.sel #bubbleX { display: block; }
  #netStatus { position: fixed; left: 12px; top: 12px; z-index: 20; display: flex; align-items: center; gap: 8px; }
  #netDot { flex: none; width: 12px; height: 12px; border-radius: 50%; background: #e74c3c; box-shadow: 0 0 0 2px rgba(255,255,255,.85); }
  #netCount { display: none; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.75); color: #333; font: 600 13px/1.3 "Noto Sans KR", "Malgun Gothic", sans-serif; }
  .rbubble { position: fixed; left: 0; top: 0; display: none; z-index: 9; transform: translate(-50%, -100%); max-width: min(270px, 72vw); padding: 12px 16px; background: rgba(255,255,255,.93); border-radius: 18px; box-shadow: 0 6px 18px rgba(0,0,0,.22); color: #333; font: 15px/1.45 "Noto Sans KR", "Malgun Gothic", sans-serif; white-space: pre-wrap; word-break: break-word; pointer-events: none; box-sizing: border-box; }
  .rbubble::after { content: ""; position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); border: 10px solid transparent; border-bottom: 0; border-top-color: rgba(255,255,255,.93); }
    </style>
</head>
<body>
<div id="netStatus" title="멀티플레이: 확인 중"><span id="netDot"></span><span id="netCount"></span></div>
<div id="chatIn"><div class="row"><input id="chatText" type="text" maxlength="200" placeholder="말을 입력하세요 (200자 이내)" autocomplete="off"><button id="chatSend">말하기</button></div><div id="chatCount">0 / 200</div></div>
<div id="bubble"><button id="bubbleX" aria-label="삭제">×</button><span id="bubbleText"></span></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var HAZE = 0xe0cacb, EYE = 22;
  // 06:00-17:59 = day, otherwise night (checked when the file is opened)
  var hr = new Date().getHours(), NIGHT = !(hr >= 6 && hr < 18);
  var PAL = NIGHT
    ? [[0.20, 0.18, 0.36], [0.137, 0.165, 0.333], [0.102, 0.129, 0.314], [0.043, 0.063, 0.188]]
    : [[0.878, 0.792, 0.796], [0.83, 0.77, 0.79], [0.682, 0.702, 0.761], [0.561, 0.608, 0.702]];
  function v3(p) { return 'vec3(' + p.join(',') + ')'; }

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.fog = new THREE.Fog(NIGHT ? 0x332e5c : HAZE, 120, 900);

  var camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 4000);
  camera.rotation.order = 'YXZ';
  scene.add(camera);

  // sky dome (follows camera position, not rotation)
  var sky = new THREE.Mesh(
    new THREE.SphereGeometry(3000, 32, 24),
    new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, fog: false,
      vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader: 'varying vec3 vP; void main(){' +
        ' float h = clamp(normalize(vP).y, 0.0, 1.0);' +
        ' vec3 a = ' + v3(PAL[0]) + ';' +
        ' vec3 b = ' + v3(PAL[1]) + ';' +
        ' vec3 c = ' + v3(PAL[2]) + ';' +
        ' vec3 d = ' + v3(PAL[3]) + ';' +
        ' vec3 col = mix(a, b, smoothstep(0.0, 0.15, h));' +
        ' col = mix(col, c, smoothstep(0.1, 0.5, h));' +
        ' col = mix(col, d, smoothstep(0.4, 1.0, h));' +
        ' gl_FragColor = vec4(col, 1.0); }'
    })
  );
  sky.renderOrder = -2;
  scene.add(sky);

  // crescent moon (night) / sun (day)
  var mc = document.createElement('canvas');
  mc.width = mc.height = 256;
  var mg = mc.getContext('2d');
  if (NIGHT) {
    // night: crescent moon
    mg.fillStyle = '#FFFED7';
    mg.beginPath(); mg.arc(128, 128, 100, 0, Math.PI * 2); mg.fill();
    mg.globalCompositeOperation = 'destination-out';
    mg.beginPath(); mg.arc(170, 100, 90, 0, Math.PI * 2); mg.fill();
  } else {
    // day: sun in the #FAECC5 colour family
    var dg = mg.createRadialGradient(128, 128, 0, 128, 128, 56);
    dg.addColorStop(0, '#fff6dc'); dg.addColorStop(1, '#faecc5');
    mg.fillStyle = dg;
    mg.beginPath(); mg.arc(128, 128, 56, 0, Math.PI * 2); mg.fill();
  }
  var moon = new THREE.Mesh(
    new THREE.PlaneGeometry(NIGHT ? 90 : 220, NIGHT ? 90 : 220),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(mc), transparent: true, fog: false, depthWrite: false })
  );
  moon.renderOrder = -1;
  scene.add(moon);

  // stars (night only)
  var stars = null;
  if (NIGHT) {
    var SN = 600, spos = new Float32Array(SN * 3);
    for (var si = 0; si < SN; si++) {
      var sy = 0.04 + Math.random() * 0.96, sr = Math.sqrt(1 - sy * sy), sa = Math.random() * Math.PI * 2;
      spos[si * 3] = Math.cos(sa) * sr * 2800; spos[si * 3 + 1] = sy * 2800; spos[si * 3 + 2] = Math.sin(sa) * sr * 2800;
    }
    var sgeo = new THREE.BufferGeometry();
    sgeo.setAttribute('position', new THREE.BufferAttribute(spos, 3));
    stars = new THREE.Points(sgeo, new THREE.PointsMaterial({ color: 0xffffff, size: 2.4, sizeAttenuation: false, fog: false, transparent: true, opacity: 0.9, depthWrite: false }));
    stars.renderOrder = -1.5;
    stars.frustumCulled = false;
    scene.add(stars);
  }

  scene.add(NIGHT ? new THREE.HemisphereLight(0x7080c8, 0x4a3a6a, 0.6) : new THREE.HemisphereLight(0xe8d0d0, 0xeab6b8, 0.75));
  var sun = NIGHT ? new THREE.DirectionalLight(0xa9bcff, 0.5) : new THREE.DirectionalLight(0xffe4e0, 0.9);
  sun.position.set(-300, 120, 200);
  scene.add(sun);

  // noise
  function hash(x, y) { var s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
  function vnoise(x, y) {
    var ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    var ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    var a = hash(ix, iy), b = hash(ix + 1, iy), c = hash(ix, iy + 1), d = hash(ix + 1, iy + 1);
    return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
  }
  function fbm(x, y) {
    var v = 0, a = 0.5;
    for (var i = 0; i < 3; i++) { v += a * vnoise(x, y); x *= 2.03; y *= 2.03; a *= 0.5; }
    return v;
  }

  // terrain: gentle low dunes + one simple mountain-shaped dune
  var OX = 0, OZ = 0, OL = 10, OS = 0.5;
  var MTS = [
    [40, -320, 330, 260, 190],
    [-520, -80, 260, 220, 150],
    [560, -150, 280, 230, 165],
    [-260, -800, 300, 240, 175],
    [420, -780, 260, 210, 140],
    [-700, 520, 280, 230, 160],
    [180, 640, 250, 200, 130],
    [800, 560, 270, 220, 150],
    [-880, -620, 240, 200, 135]
  ];
  function height(x, z) {
    var warp = fbm(x * 0.005, z * 0.005) * 8;
    var w = Math.sin((x * 0.5 + z * 0.86) * 0.012 + warp) * 0.5 + 0.5;
    var h = Math.pow(w, 2.2) * 12 + fbm(x * 0.003 + 7, z * 0.003 + 3) * 22;
    var peak = 0;
    for (var i = 0; i < MTS.length; i++) {
      var m = MTS[i];
      var dx = (x - m[0]) / m[2], dz = (z - m[1]) / m[3];
      var cone = Math.max(0, 1 - Math.sqrt(dx * dx + dz * dz));
      if (cone <= 0) continue;
      var bx = (x - (m[0] + m[2] * 0.2)) / (m[2] * 0.21), bz = (z - (m[1] + m[3] * 0.35)) / (m[3] * 0.21);
      var v = m[4] * Math.pow(cone, 1.15) - m[4] * 0.115 * Math.exp(-(bx * bx + bz * bz)) * Math.min(1, cone * 3);
      peak = Math.max(peak, v);
    }
    var od = Math.sqrt((x - OX) * (x - OX) + (z - OZ) * (z - OZ));
    var tt = Math.min(1, Math.max(0, (od - 34) / 25));
    tt = tt * tt * (3 - 2 * tt);
    return OL + (h + peak - OL) * tt;
  }

  var SIZE = 2600, SEG = 380;
  var geo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
  geo.rotateX(-Math.PI / 2);
  var pos = geo.attributes.position;
  for (var i = 0; i < pos.count; i++) pos.setY(i, height(pos.getX(i), pos.getZ(i)));
  geo.computeVertexNormals();
  var cols = new Float32Array(pos.count * 3);
  var lo = new THREE.Color(0xf2bfc0), hi = new THREE.Color(0xffd8d8), tmp = new THREE.Color();
  for (var j = 0; j < pos.count; j++) {
    tmp.copy(lo).lerp(hi, Math.min(1, Math.max(0, pos.getY(j) / 150)));
    cols[j * 3] = tmp.r; cols[j * 3 + 1] = tmp.g; cols[j * 3 + 2] = tmp.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  var terrain = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true }));
  scene.add(terrain);


  // character: burlap hooded doll (faces +z)
  function M(c) { return new THREE.MeshLambertMaterial({ color: c }); }
  function add(p, geo, mat, x, y, z) { var m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); p.add(m); return m; }
  var NAMES = ['하늘','보리','다온','나래','소담','도담','하람','새봄','아라','구름','별이','온새미','가온','나비','마루','포근','미르','소망','이슬','단비','모래','하랑','다솜','햇살','달래','푸름','늘봄','로운'];
  function createDoll(label) {
  var burlap = M(0xcfb48a), burlapD = M(0xb99a6e), jacket = M(0xf6f6f6), pants = M(0xF28C28),
      boot = M(0x5a3a2a), glove = M(0xd8c4a2), leather = M(0x6b4a33), black = new THREE.MeshPhongMaterial({ color: 0x050505, shininess: 90 });
  var doll = new THREE.Group();
  var headG = new THREE.Group();
  doll.add(headG);
  var head = add(headG, new THREE.SphereGeometry(5.2, 28, 22), burlap, 0, 12.6, 0.4);
  head.scale.set(1, 1.05, 0.95);
  var hoodMat = new THREE.MeshLambertMaterial({ color: 0xf8f8f8, side: THREE.DoubleSide });
  var hood = add(headG, new THREE.SphereGeometry(6.1, 28, 22, Math.PI / 2 + 0.75, Math.PI * 2 - 1.5, 0, Math.PI * 0.82), hoodMat, 0, 12.8, -0.4);
  hood.scale.set(1, 1.08, 1.05);
      var buttonMat = new THREE.MeshPhongMaterial({ color: 0x1b1b1b, shininess: 100, specular: 0x666666 });
  var buttonRim = new THREE.MeshPhongMaterial({ color: 0x2b2b2b, shininess: 60, specular: 0x555555 });
  var holeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
  [-1, 1].forEach(function (sx) {
    var btn = new THREE.Group();
    btn.position.set(sx * 2.3, 12.9, 4.95);
    btn.rotation.y = sx * 0.4;
    var disc = new THREE.Mesh(new THREE.CylinderGeometry(0.72, 0.72, 0.28, 28), buttonMat);
    disc.rotation.x = Math.PI / 2;
    btn.add(disc);
    var rim = new THREE.Mesh(new THREE.TorusGeometry(0.52, 0.09, 8, 24), buttonRim);
    rim.position.z = 0.15;
    btn.add(rim);
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(function (h) {
      var hole = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.05, 10), holeMat);
      hole.rotation.x = Math.PI / 2;
      hole.position.set(h[0] * 0.2, h[1] * 0.2, 0.15);
      btn.add(hole);
    });
    headG.add(btn);
  });
          var mouth = add(headG, new THREE.TorusGeometry(0.8, 0.13, 8, 24, Math.PI * 0.8), M(0x3a1a1a), 0, 11.8, 5.2);
  mouth.rotation.z = Math.PI * 1.1;
  var leafShape = new THREE.Shape();
  leafShape.moveTo(0, 0);
  leafShape.bezierCurveTo(-0.9, -0.1, -1.7, 0.5, -1.5, 1.5);
  leafShape.bezierCurveTo(-1.35, 2.25, -0.4, 2.45, 0, 1.9);
  leafShape.bezierCurveTo(0.4, 2.45, 1.35, 2.25, 1.5, 1.5);
  leafShape.bezierCurveTo(1.7, 0.5, 0.9, -0.1, 0, 0);
  var leafGeo = new THREE.ExtrudeGeometry(leafShape, { depth: 0.35, bevelEnabled: false });
  var cloverMat = new THREE.MeshLambertMaterial({ color: 0x1e8f3e });
  var clover = new THREE.Group();
  for (var k = 0; k < 4; k++) {
    var leaf = new THREE.Mesh(leafGeo, cloverMat);
    leaf.rotation.z = k * Math.PI / 2;
    clover.add(leaf);
  }
  var stemCurve = new THREE.QuadraticBezierCurve3(new THREE.Vector3(0, -1.7, 0.17), new THREE.Vector3(0.1, -3.2, 0.17), new THREE.Vector3(1.1, -4.6, 0.17));
  clover.add(new THREE.Mesh(new THREE.TubeGeometry(stemCurve, 12, 0.11, 6, false), cloverMat));
  clover.position.set(0, 7.4, 4.5);
  clover.scale.setScalar(0.8);
  doll.add(clover);
  add(doll, new THREE.CylinderGeometry(3.7, 4.7, 6.4, 20), jacket, 0, 5.4, 0);
  var dome = add(doll, new THREE.SphereGeometry(1, 20, 14), jacket, 0, 8.3, 0);
  dome.scale.set(3.9, 1.2, 3.7);
  add(doll, new THREE.CylinderGeometry(4.75, 4.85, 0.6, 20), M(0xdcdcdc), 0, 2.4, 0);
        add(doll, new THREE.SphereGeometry(0.95, 14, 12), M(0xF28C28), -2.2, 4.3, 3.9);
    var red = M(0xe8e8e8), gold = M(0xe0b040);
  var pb = add(doll, new THREE.SphereGeometry(1, 20, 16), red, 0, 5.2, -4.8);
  pb.scale.set(3, 3, 2.2);
  add(doll, new THREE.CylinderGeometry(1.0, 1.7, 1.2, 14), red, 0, 7.7, -4.8);
      var tie = add(doll, new THREE.TorusGeometry(1.05, 0.22, 8, 16), gold, 0, 8.1, -4.8);
  tie.rotation.x = Math.PI / 2;
  add(doll, new THREE.SphereGeometry(0.55, 10, 8), gold, 0, 3.4, -6.9);
  var sh = add(doll, new THREE.SphereGeometry(3.6, 18, 14), pants, 0, 3.6, 0);
  sh.scale.set(1.05, 0.72, 0.95);
  function limb(x, y, sleeve) {
    var g = new THREE.Group();
    g.position.set(x, y, 0);
    doll.add(g);
    if (sleeve) {
      add(g, new THREE.SphereGeometry(1.15, 16, 12), jacket, 0, 0, 0);
      add(g, new THREE.CylinderGeometry(1.15, 1.05, 4.4, 10), jacket, 0, -2.2, 0);
      add(g, new THREE.SphereGeometry(1.35, 10, 8), glove, 0, -4.7, 0);
    } else {
      add(g, new THREE.CylinderGeometry(0.9, 0.9, 1.6, 8), pants, 0, -0.8, 0);
      var b = add(g, new THREE.SphereGeometry(1.9, 14, 12), boot, 0, -1.5, 1.0);
      b.scale.set(1, 0.75, 1.7);
    }
    return g;
  }
  var armL = limb(-4.6, 8.2, true), armR = limb(4.6, 8.2, true);
  var legL = limb(-2.0, 2.4, false), legR = limb(2.0, 2.4, false);
  armL.rotation.z = -0.25; armR.rotation.z = 0.25;
  doll.rotation.order = 'YXZ';
  doll.rotation.y = 0;
  doll.scale.setScalar(0.25);
  var lc = document.createElement('canvas');
  lc.width = 512; lc.height = 192;
  var lg = lc.getContext('2d');
  lg.fillStyle = 'rgba(255,255,255,0.7)';
  lg.shadowColor = 'rgba(0,0,0,0.25)'; lg.shadowBlur = 14; lg.shadowOffsetY = 4;
  lg.beginPath();
  (function (x, y, w, h, rx, ry) {
    var P = Math.PI;
    lg.moveTo(x + rx, y);
    lg.lineTo(x + w - rx, y);
    lg.ellipse(x + w - rx, y + ry, rx, ry, 0, -P / 2, 0);
    lg.lineTo(x + w, y + h - ry);
    lg.ellipse(x + w - rx, y + h - ry, rx, ry, 0, 0, P / 2);
    lg.lineTo(x + rx, y + h);
    lg.ellipse(x + rx, y + h - ry, rx, ry, 0, P / 2, P);
    lg.lineTo(x, y + ry);
    lg.ellipse(x + rx, y + ry, rx, ry, 0, P, P * 1.5);
    lg.closePath();
  })(20, 20, 472, 152, 76, 76);
  lg.fill();
  lg.shadowColor = 'transparent'; lg.shadowBlur = 0; lg.shadowOffsetY = 0;
  lg.fillStyle = '#3a3a44';
  lg.font = '500 88px "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
  lg.textAlign = 'center'; lg.textBaseline = 'middle';
  lg.fillText(label, 256, 100);
  var tag = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(lc), transparent: true, fog: false }));
  tag.scale.set(9.75, 3.64, 1);
  tag.position.set(0, 22.5, 0);
  headG.add(tag);
    return { doll: doll, headG: headG, armL: armL, armR: armR, legL: legL, legR: legR, tag: tag, label: label };
  }
  var me = createDoll(NAMES[Math.floor(Math.random() * NAMES.length)]);
  var doll = me.doll, headG = me.headG, armL = me.armL, armR = me.armR, legL = me.legL, legR = me.legR, tag = me.tag;
  scene.add(doll);
  var slopeS = 0, tiltS = 0, facing = 0, walkPhase = 0, px = 0, pz = 110;

  // white fence marking the edge of the walkable area
  var LIMIT = 750, FENCE = LIMIT + 10, STEP = 12;
  var fwhite = new THREE.MeshLambertMaterial({ color: 0xffffff });
  var edge = [];
  for (var q = -FENCE; q < FENCE; q += STEP) edge.push(q);
  var path = [];
  edge.forEach(function (q) { path.push([q, -FENCE]); });
  edge.forEach(function (q) { path.push([FENCE, q]); });
  edge.forEach(function (q) { path.push([-q, FENCE]); });
  edge.forEach(function (q) { path.push([-FENCE, -q]); });
  var n = path.length;
  var posts = new THREE.InstancedMesh(new THREE.BoxGeometry(1.4, 9, 1.4), fwhite, n);
  var rails = new THREE.InstancedMesh(new THREE.BoxGeometry(0.6, 0.6, 1), fwhite, n * 2);
  var dm = new THREE.Object3D();
  for (var pi = 0; pi < n; pi++) {
    var a = path[pi], b = path[(pi + 1) % n];
    var ya = height(a[0], a[1]), yb = height(b[0], b[1]);
    dm.scale.set(1, 1, 1); dm.rotation.set(0, 0, 0);
    dm.position.set(a[0], ya + 3.5, a[1]); dm.updateMatrix();
    posts.setMatrixAt(pi, dm.matrix);
    [3.2, 6.4].forEach(function (hh, ri) {
      var pa = new THREE.Vector3(a[0], ya + hh, a[1]), pb = new THREE.Vector3(b[0], yb + hh, b[1]);
      dm.position.copy(pa).add(pb).multiplyScalar(0.5);
      dm.lookAt(pb);
      dm.scale.set(1, 1, pa.distanceTo(pb));
      dm.updateMatrix();
      rails.setMatrixAt(pi * 2 + ri, dm.matrix);
    });
  }
  posts.frustumCulled = false; rails.frustumCulled = false;
  scene.add(posts); scene.add(rails);


  // ===== oasis =====
  var oasis = new THREE.Group();
  oasis.position.set(OX, OL, OZ);
  oasis.scale.setScalar(OS);

    if (hpP && !riding) { startClimb(hpP); return; }
    if (!riding) {
      var hw = ray.intersectObject(water)[0];
      if (hw) {
        var np2 = nearestOn(cur, polyOut), out2 = cur.clone().sub(np2.p);
        if (inPoly(cur, polyOut) || out2.lengthSq() < 1e-6) out2.set(0, 1);
        out2.normalize();
        climb = null;
        drinkPt.copy(np2.p);
        target.copy(np2.p).addScaledVector(out2, 1.2);
        drinkState = 1;
        marker.position.set(np2.p.x, OL + 0.6, np2.p.y);
        markerLife = 1;
        return;
      }
    }
    var hit = ray.intersectObject(terrain)[0];
    if (!hit) return;
    var tx = Math.max(-LIMIT, Math.min(LIMIT, hit.point.x)), tz = Math.max(-LIMIT, Math.min(LIMIT, hit.point.z));
    var tp = new THREE.Vector2(tx, tz);
    if (inPoly(tp, polyOut)) {
      var nn = nearestOn(tp, polyOut), dv = nn.p.clone().sub(tp).normalize();
      tp.copy(nn.p).addScaledVector(dv, 0.6);
      tx = tp.x; tz = tp.y;
    }
    drinkState = 0;
    rideAuto = false; rideIdle = 0;
    if (climb) climb = null;
    target.set(tx, tz);
    marker.position.set(tx, height(tx, tz) + 0.6, tz);
    markerLife = 1;
  }

    
  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  var clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 0.05);
    var f = 1 - Math.exp(-dt * 1.6 / (1 + Math.max(0, slopeS) * 2));
    updateCamels(dt);
    if (riding) cur.copy(riding.pos);
    var free = !riding && !xfer && !(climb && climb.state !== 'approach');
    if (free) {
      cur.lerp(target, f);
      if (inPoly(cur, polyOut)) {
        var cn = nearestOn(cur, polyOut), cd = cn.p.clone().sub(cur).normalize();
        cur.copy(cn.p).addScaledVector(cd, 0.3);
      }
      avoidCamels(cur);
      avoidPlayers(cur);
    }
    camY += (height(cur.x, cur.y) + climbY - camY) * (1 - Math.exp(-dt * 6));
    var vx = cur.x - px, vz = cur.y - pz, spd = Math.sqrt(vx * vx + vz * vz) / Math.max(dt, 0.001);
    px = cur.x; pz = cur.y;
    if (spd > 2) {
      var want = Math.atan2(vx, vz), dlt = want - facing;
      dlt = Math.atan2(Math.sin(dlt), Math.cos(dlt));
      facing += dlt * (1 - Math.exp(-dt * 8));
    }
    var amp = Math.min(1, spd / 25);
    walkPhase += dt * (4 + spd * 0.12);
    var sw = Math.sin(walkPhase) * 0.7 * amp;
    if (free) {
      legL.rotation.x = sw; legR.rotation.x = -sw;
      armL.rotation.x = -sw * 0.8; armR.rotation.x = sw * 0.8;
    }
    var cp = nearestOn(cur, polyOut), nearO = cp.d < 7;
    var lean = 0;
    if (drinkState === 1 && cur.distanceTo(target) < 0.7) { drinkState = 2; drinkT = 0; lastSip = -2; }
    if (drinkState === 2) {
      drinkT += dt;
      var dfac = Math.atan2(drinkPt.x - cur.x, drinkPt.y - cur.y), ddf = Math.atan2(Math.sin(dfac - facing), Math.cos(dfac - facing));
      facing += ddf * (1 - Math.exp(-dt * 8));
      var TT = 3.6, up = Math.min(1, drinkT / 0.7), dn = Math.min(1, Math.max(0, (drinkT - (TT - 0.7)) / 0.7));
      var ss = function (v) { return v * v * (3 - 2 * v); };
      var bow = ss(up) * (1 - ss(dn));
      var sip = (drinkT > 0.7 && drinkT < TT - 0.7) ? (Math.sin((drinkT - 0.7) * 7) * 0.5 + 0.5) : 0;
      lean = bow * (0.5 + 0.2 * sip);
      armL.rotation.x = armR.rotation.x = -bow * 1.25;
      armL.rotation.z = -0.25 + bow * 0.4; armR.rotation.z = 0.25 - bow * 0.4;
      if (drinkT > 0.7 && drinkT < TT - 0.7) {
        var cyc = Math.floor(((drinkT - 0.7) * 7 - Math.PI / 2) / (Math.PI * 2));
        if (cyc >= 0 && cyc !== lastSip) { lastSip = cyc; splash(drinkPt.x, drinkPt.y); }
      }
      ripple.position.set(drinkPt.x, OL + 0.5, drinkPt.y);
      ripple.material.opacity = 0.7 * sip * bow;
      ripple.scale.setScalar((1 + sip * 2.5) * OS);
      if (drinkT >= TT) { drinkState = 0; armL.rotation.z = -0.25; armR.rotation.z = 0.25; ripple.material.opacity = 0; }
    }
    for (var di = 0; di < DROPS; di++) {
      var dr = drops[di];
      if (!dr.visible) continue;
      var ud = dr.userData;
      ud.v.y -= 16 * dt;
      dr.position.addScaledVector(ud.v, dt);
      ud.life -= dt;
      if (ud.life <= 0 || dr.position.y < OL + 0.4) dr.visible = false;
    }
    var gh = height(cur.x, cur.y), fx = Math.sin(facing), fz = Math.cos(facing), dd = 2;
    var slope = (height(cur.x + fx * dd, cur.y + fz * dd) - height(cur.x - fx * dd, cur.y - fz * dd)) / (2 * dd);
    slopeS += (slope - slopeS) * (1 - Math.exp(-dt * 5));
    tiltS += (-Math.atan(slope) * 0.9 - tiltS) * (1 - Math.exp(-dt * 8));
    if (free) {
      doll.position.set(cur.x, gh + Math.abs(Math.sin(walkPhase)) * 0.4 * amp, cur.y);
      doll.rotation.y = facing;
      doll.rotation.x = tiltS + lean;
      doll.rotation.z = Math.sin(walkPhase) * 0.04 * amp;
    }
    updateXfer(dt);
    updateRiders(dt);
    updateRemotes(dt);
    updateClimb(dt);
    var stackIdx = riding ? Math.max(0, riding.riders.indexOf(me)) : (xfer && xfer.type === 'mount' ? xfer.c.riders.length : 0);
    camH += ((riding || (xfer && xfer.type === 'mount') ? 6 + stackIdx * 4.3 : 2.25) - camH) * (1 - Math.exp(-dt * 4));

    var fwd = new THREE.Vector3(-Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
    var tgt = new THREE.Vector3(cur.x, camY + camH, cur.y);
    camera.position.copy(tgt).addScaledVector(fwd, -camDist);
    camera.position.y = Math.max(camera.position.y, height(camera.position.x, camera.position.z) + 2);
    camera.rotation.set(pitch, yaw, 0);

    sky.position.copy(camera.position);
    if (stars) stars.position.copy(camera.position);
    moon.position.set(camera.position.x + 120, 330, camera.position.z - 2400);
    moon.lookAt(camera.position);

    if (markerLife > 0) {
      markerLife = Math.max(0, markerLife - dt * 1.2);
      marker.material.opacity = markerLife * 0.9;
      marker.scale.setScalar(1 + (1 - markerLife) * 2);
    }
    updateChatUI();
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
<script type="module">
  // ▼▼▼ Firebase 콘솔의 firebaseConfig 값 (관리자 키·비밀키는 절대 넣지 마세요) ▼▼▼
  const firebaseConfig = {
    apiKey: "AIzaSyDR24ODeoi_Gi_2YvU0MdsV9zWCroDoXLo",
    authDomain: "desert-test1.firebaseapp.com",
    databaseURL: "https://desert-test1-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "desert-test1",
    appId: "1:793089262326:web:95c7bab91a79d17f6d62d7"
  };
  // ▲▲▲ 여기까지 ▲▲▲

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getDatabase, ref, set, update, onValue, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const D = window.desert;
  const badge = document.getElementById("netStatus"), dot = document.getElementById("netDot"), countEl = document.getElementById("netCount");
  const status = (text, ok) => {
    dot.style.background = ok ? "#2ecc71" : "#e74c3c";
    badge.title = "멀티플레이: " + text;
    if (!ok) countEl.style.display = "none";
  };
  const hint = (e) => {
    const c = (e && e.code) || "", m = (e && e.message) || String(e);
    if (c === "auth/operation-not-allowed") return "익명 로그인이 꺼져 있어요 (Authentication → 로그인 방법에서 익명을 켜 주세요)";
    if (c === "auth/unauthorized-domain") return "승인된 도메인에 이 사이트 주소를 추가해 주세요";
    if (c.indexOf("api-key") >= 0 || c === "auth/invalid-api-key") return "apiKey 값이 올바른지 확인해 주세요";
    if (/permission_denied/i.test(c + m)) return "서버가 거절했어요 (Realtime Database 규칙을 게시했는지 확인해 주세요)";
    return c || m;
  };

  if (!firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith("YOUR_")) {
    status("혼자 모드 (firebaseConfig가 비어 있어요)", false);
  } else {
    start().catch((e) => { console.warn("[멀티플레이] 연결 실패", e); status("연결 실패 - " + hint(e), false); });
  }

  async function start() {
    status("연결 중…", false);
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const uid = (await signInAnonymously(auth)).user.uid;            // 익명 로그인
    const myKey = uid + "_" + Math.random().toString(36).slice(2, 8); // 탭마다 다른 캐릭터
    const meRef = ref(db, "players/" + myKey);
    const NCAM = D.camelCount();
    const round = (v) => Math.round(v * 100) / 100;
    let players = {}, lastSent = "", wroteOnce = false, othersCount = 0;
    const showCount = () => {
      status("접속됨 · 다른 유저 " + othersCount + "명", true);
      countEl.textContent = (othersCount + 1) + "명 방황 중";
      countEl.style.display = "inline-block";
    };
    const camSent = {};
    status("로그인됨, 데이터 확인 중…", false);

    // 접속할 때마다: 연결이 끊기면 서버가 내 칸(위치·말풍선·탑승 정보)을 통째로 지우도록 예약
    onValue(ref(db, ".info/connected"), (s) => {
      if (s.val() === true) { onDisconnect(meRef).remove().catch(() => {}); lastSent = ""; }
    });

    // 낙타를 누가 움직일지: 탄 사람(키가 가장 작은 사람) → 없으면 접속자 중 키가 가장 작은 사람
    function controllerOf(i) {
      const riders = Object.keys(players).filter((k) => players[k] && players[k].camel === i).sort();
      if (riders.length) return riders[0];
      return Object.keys(players).concat([myKey]).sort()[0];
    }
    function applyControl() {
      for (let i = 0; i < NCAM; i++) D.camelNet(i, controllerOf(i) !== myKey);
    }

    onValue(ref(db, "players"), (snap) => {
      players = snap.val() || {};
      const seen = new Set();
      for (const [k, v] of Object.entries(players)) {
        if (k === myKey || !v || typeof v.x !== "number" || typeof v.z !== "number") continue;
        seen.add(k);
        D.setRemote(k, v);
      }
      D.pruneRemotes(seen);
      applyControl();
      othersCount = seen.size;
      if (wroteOnce) showCount(); else status("읽기 성공, 내 정보 올리는 중…", false);
    }, (e) => { console.warn("[멀티플레이] 읽기 거부", e); status("읽기 실패 - " + hint(e), false); });

    onValue(ref(db, "camels"), (snap) => {
      const v = snap.val() || {};
      for (const [i, c] of Object.entries(v)) D.camelRecv(Number(i), c.x, c.z, c.f);
    }, (e) => console.warn("[멀티플레이] 낙타 읽기 거부", e));

    // 0.1초마다: 바뀐 내용만 올리기
    setInterval(() => {
      const m = D.getMe();
      const data = { name: m.name, x: round(m.x), z: round(m.z), f: round(m.f), camel: m.camel, t: serverTimestamp() };
      if (m.say) data.say = m.say;
      if (m.act) { data.act = m.act; if (m.act === 2) { data.palm = m.palm; data.u = round(m.u); } }
      const key = JSON.stringify([data.name, data.x, data.z, data.f, data.camel, data.say || "", data.act || 0, data.palm || 0, data.u || 0]);
      if (key !== lastSent) {
        lastSent = key;
        set(meRef, data).then(() => { wroteOnce = true; showCount(); }).catch((e) => { console.warn("[멀티플레이] 쓰기 거부", e); status("내 정보를 올리지 못했어요 - " + hint(e), false); });
      }

      const up = {};
      for (let i = 0; i < NCAM; i++) {
        if (controllerOf(i) !== myKey) continue;
        const c = D.camelState(i);
        const k = [round(c.x), round(c.z), round(c.f)].join(",");
        if (k !== camSent[i]) { camSent[i] = k; up["camels/" + i] = { x: round(c.x), z: round(c.z), f: round(c.f), t: serverTimestamp() }; }
      }
      if (Object.keys(up).length) update(ref(db), up).catch((e) => console.warn("[멀티플레이] 낙타 쓰기 거부", e));
    }, 100);
  }
</script>
