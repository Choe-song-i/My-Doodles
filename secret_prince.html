<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>비밀일기</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #02040f;
        font-family:
          system-ui,
          -apple-system,
          "Noto Sans KR",
          sans-serif;
      }
      canvas {
        display: block;
        touch-action: none;
        cursor: grab;
      }
      canvas.dragging {
        cursor: grabbing;
      }
      [hidden] {
        display: none !important;
      }
      #exitBtn {
        position: fixed;
        z-index: 6;
        top: calc(12px + env(safe-area-inset-top, 0px));
        left: calc(12px + env(safe-area-inset-left, 0px));
        width: 42px;
        height: 42px;
        padding: 0;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(128, 128, 138, 0.35);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        transition:
          background 0.2s,
          transform 0.1s;
      }
      #exitBtn:hover {
        background: rgba(150, 150, 160, 0.48);
      }
      #exitBtn:active {
        transform: scale(0.94);
      }
      .pop,
      #secretModal .card {
        background: rgba(72, 74, 80, 0.86);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.22);
        color: #fff;
        border-radius: 18px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
        font-family:
          system-ui,
          -apple-system,
          "Noto Sans KR",
          sans-serif;
      }
      .pop {
        position: fixed;
        z-index: 10;
        transform: translate(-50%, -100%);
        width: min(290px, 86vw);
        padding: 16px 18px 14px;
        box-sizing: border-box;
        text-align: center;
      }
      .pop::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -8px;
        width: 14px;
        height: 14px;
        margin-left: -7px;
        background: rgba(72, 74, 80, 0.86);
        border-right: 1px solid rgba(255, 255, 255, 0.22);
        border-bottom: 1px solid rgba(255, 255, 255, 0.22);
        transform: rotate(45deg);
      }
      .pop p,
      #secretModal p {
        margin: 0 0 12px;
        font-size: 15px;
        line-height: 1.65;
      }
      .row {
        display: flex;
        gap: 8px;
        justify-content: center;
      }
      .pop button,
      #secretModal button {
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        padding: 9px 18px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        cursor: pointer;
        color: #fff;
        background: rgba(128, 128, 138, 0.35);
      }
      .pop button.primary,
      #secretModal button.primary {
        background: #f6d66a;
        color: #2a2000;
        border-color: transparent;
      }
      #secretModal {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.45);
      }
      #secretModal .card {
        width: min(340px, 90vw);
        padding: 18px;
        box-sizing: border-box;
        text-align: center;
      }
      #secretText {
        width: 100%;
        box-sizing: border-box;
        resize: none;
        padding: 10px 12px;
        border-radius: 12px;
        font: inherit;
        font-size: 15px;
        line-height: 1.5;
        color: #fff;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.25);
        outline: none;
      }
      #secretText:focus {
        border-color: #f6d66a;
      }
      #secretModal .note {
        margin: 8px 0 12px;
        font-size: 12px;
        color: #d6d8dc;
      }
    </style>
  </head>
  <body>
    <button id="exitBtn" aria-label="나가기" title="나가기">
      <svg
        width="18"
        height="18"
        viewBox="0 0 18 18"
        fill="none"
        stroke="#fff"
        stroke-width="2.4"
        stroke-linecap="round"
      >
        <path d="M3 3 L15 15 M15 3 L3 15" />
      </svg>
    </button>

    <div id="roseBubble" class="pop" hidden>
      <p>
        내 비밀을 알려줄게.<br />너는 나에게 아주 소중한 존재야.<br />너의
        비밀을 알려줘.
      </p>
      <div class="row">
        <button id="secretWrite" class="primary">비밀 적기</button
        ><button id="secretCancel">취소</button>
      </div>
    </div>
    <div id="secretModal" hidden>
      <div class="card">
        <p>너의 비밀을 적어줘.</p>
        <textarea
          id="secretText"
          rows="3"
          maxlength="300"
          placeholder="여기에 비밀을 적어보세요…"
        ></textarea>
        <div class="note">이 내용은 나만 볼 수 있어요.</div>
        <button id="secretOk" class="primary">확인</button>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";

      /* ---------- P2P(Trystero) 스위치 ----------
   false: Trystero를 불러오지도, 연결하지도 않음 (혼자 플레이)
   true : 다시 연결 (같은 방 #방이름 으로 접속한 사람들과 만남) */
      const ENABLE_P2P = false;

      let joinRoom = null;
      let selfId = Math.random().toString(36).slice(2, 10); // 연결을 끈 동안 쓰는 내 임시 ID
      if (ENABLE_P2P) {
        try {
          const mod =
            await import("https://cdn.jsdelivr.net/npm/trystero@0.26.0/+esm");
          joinRoom = mod.joinRoom;
          selfId = mod.selfId;
        } catch (e) {
          console.error("Trystero 불러오기 실패", e);
        }
      }

      const NAVY = 0x02040f; // 밤 12시 같은 아주 어두운 남색
      const V = (x, y, z) => new THREE.Vector3(x, y, z);

      /* ---------- Scene ---------- */
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(NAVY);

      const camera = new THREE.PerspectiveCamera(
        45,
        innerWidth / innerHeight,
        0.1,
        300,
      );
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      document.body.appendChild(renderer.domElement);
      scene.add(camera);

      /* ---------- 별 (월드 좌표에 고정된 작은 점 모양 별, 하늘 전체에 흩어짐) ---------- */
      const skyGroup = new THREE.Group(); // 행성 중심에 놓임 (아래 행성 코드에서 위치 지정)
      scene.add(skyGroup);
      const starGroups = [];
      {
        const c = document.createElement("canvas");
        c.width = c.height = 32;
        const g = c.getContext("2d");
        g.fillStyle = "#fff";
        g.beginPath();
        g.arc(16, 16, 14, 0, Math.PI * 2);
        g.fill(); // 번짐 없는 단단한 점
        const tex = new THREE.CanvasTexture(c);
        const rnd = mulberry32(777);
        const SKY_R = 180;
        const pr = renderer.getPixelRatio();
        for (const [count, size] of [
          [520, 2.2],
          [130, 2.2],
          [28, 2.2],
        ]) {
          const pos = new Float32Array(count * 3),
            col = new Float32Array(count * 3);
          for (let i = 0; i < count; i++) {
            const u = rnd() * 2 - 1,
              a = rnd() * Math.PI * 2,
              r = Math.sqrt(1 - u * u);
            pos.set(
              [SKY_R * r * Math.cos(a), SKY_R * u, SKY_R * r * Math.sin(a)],
              i * 3,
            );
            const w = rnd(),
              b = 0.6 + 0.4 * rnd();
            col.set(
              [b, b * (0.84 + 0.14 * (1 - w)), b * (0.58 + 0.3 * (1 - w))],
              i * 3,
            );
          }
          const geo = new THREE.BufferGeometry();
          geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
          geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
          const pts = new THREE.Points(
            geo,
            new THREE.PointsMaterial({
              map: tex,
              size: size * pr,
              sizeAttenuation: false,
              vertexColors: true,
              transparent: true,
              alphaTest: 0.5,
              depthWrite: false,
              fog: false,
            }),
          );
          skyGroup.add(pts);
          starGroups.push(pts);
        }
      }

      scene.add(new THREE.HemisphereLight(0xffffff, 0x2a2a30, 0.4));
      const key = new THREE.DirectionalLight(0xffffff, 1.0);
      const rim = new THREE.DirectionalLight(0x5f76ff, 0.5);
      scene.add(key, key.target, rim, rim.target);

      /* ---------- 달 표면 같은 행성 (실제로 파이고 솟은 크레이터, 시드 고정 → 모든 접속자가 같은 모양) ---------- */
      const R = 29.4; // 행성 반지름 (이전 42의 70%)
      const C = V(0, -R, 0); // 행성 중심 (꼭대기가 원점)
      skyGroup.position.copy(C);
      const DISP = 2.2; // 크레이터 깊이/높이 배율 (월드 단위)
      let heightMap = null; // 지형 높이 (캐릭터가 지면 위에 서도록 CPU에서 읽음)

      function mulberry32(a) {
        return () => {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      // 크레이터 단면 [반지름 비율, 높이]: 가운데가 깊게 파이고 가장자리가 솟은 모양
      const PROFILE = [
        [0, -1],
        [0.3, -0.92],
        [0.55, -0.7],
        [0.75, -0.4],
        [0.9, -0.1],
        [1.0, 0.35],
        [1.1, 0.3],
        [1.25, 0.1],
        [1.4, 0.02],
      ];

      function makeMoonTextures() {
        const W = 4096,
          H = 2048,
          K = 0.5;
        const mkCanvas = (w, h) => {
          const cv = document.createElement("canvas");
          cv.width = w;
          cv.height = h;
          return cv;
        };
        const cc = mkCanvas(W, H),
          bc = mkCanvas(W * K, H * K),
          dc = mkCanvas(W * K, H * K);
        const c = cc.getContext("2d"),
          b = bc.getContext("2d"),
          d = dc.getContext("2d");
        c.fillStyle = "#f6f6f6";
        c.fillRect(0, 0, W, H);
        b.fillStyle = "#808080";
        b.fillRect(0, 0, bc.width, bc.height);
        d.fillStyle = "#808080";
        d.fillRect(0, 0, dc.width, dc.height);
        b.scale(K, K);
        d.scale(K, K);
        const rand = mulberry32(20261103);
        const rnd = (a, z) => a + rand() * (z - a);
        const at = (ctx, x, y, fn) => {
          const sx = 1 / Math.max(0.25, Math.cos((0.5 - y / H) * Math.PI)); // 극지방 왜곡 보정
          for (const ox of [-W, 0, W]) {
            if (x + ox < -500 || x + ox > W + 500) continue;
            ctx.save();
            ctx.translate(x + ox, y);
            ctx.scale(sx, 1);
            fn();
            ctx.restore();
          }
        };
        // 넓은 명암 얼룩 (색상용)
        for (let i = 0; i < 260; i++) {
          const x = rnd(0, W),
            y = rnd(0, H),
            r = rnd(60, 260),
            light = rand() < 0.5;
          const rgb = light ? "255,255,255" : "120,120,120";
          at(c, x, y, () => {
            const g = c.createRadialGradient(0, 0, 0, 0, 0, r);
            g.addColorStop(0, `rgba(${rgb},${rnd(0.08, 0.22)})`);
            g.addColorStop(1, `rgba(${rgb},0)`);
            c.fillStyle = g;
            c.fillRect(-r, -r, r * 2, r * 2);
          });
        }
        // 크레이터 (큰 것부터 작은 것 순서로)
        for (const [count, rmin, rmax] of [
          [22, 70, 170],
          [140, 24, 70],
          [800, 8, 24],
          [2200, 2.5, 8],
        ]) {
          for (let i = 0; i < count; i++) {
            const x = rnd(0, W),
              y = rnd(0, H),
              r = rnd(rmin, rmax),
              age = rnd(0.55, 1);
            // 색: 은은한 음영만 (진짜 음영은 실제 형상과 조명이 만듦)
            at(c, x, y, () => {
              let g = c.createRadialGradient(0, 0, r * 0.9, 0, 0, r * 1.7);
              g.addColorStop(0, "rgba(255,255,255,0.28)");
              g.addColorStop(1, "rgba(255,255,255,0)");
              c.fillStyle = g;
              c.fillRect(-r * 1.7, -r * 1.7, r * 3.4, r * 3.4);
              c.save();
              c.beginPath();
              c.arc(0, 0, r, 0, Math.PI * 2);
              c.clip();
              c.globalAlpha = age;
              g = c.createRadialGradient(0, 0, 0, 0, 0, r);
              g.addColorStop(0, "#b4b4b4");
              g.addColorStop(0.6, "#d2d2d2");
              g.addColorStop(1, "#f0f0f0");
              c.fillStyle = g;
              c.fillRect(-r, -r, r * 2, r * 2);
              c.restore();
              c.globalAlpha = 1;
            });
            // 음영 계산용 범프 (작은 크레이터까지)
            at(b, x, y, () => {
              const Ro = r * 1.4;
              const g = b.createRadialGradient(0, 0, 0, 0, 0, Ro);
              g.addColorStop(0, "#303030");
              g.addColorStop(0.5, "#5a5a5a");
              g.addColorStop(0.66, "#b8b8b8");
              g.addColorStop(0.72, "#cfcfcf");
              g.addColorStop(1, "rgba(128,128,128,0)");
              b.fillStyle = g;
              b.beginPath();
              b.arc(0, 0, Ro, 0, Math.PI * 2);
              b.fill();
            });
            // 실제로 지오메트리를 파고 솟게 하는 변위 맵 (메시로 표현 가능한 크기만, 극지방 제외)
            if (r >= 14 && y > H * 0.1 && y < H * 0.9) {
              const amp = Math.min(1, Math.max(0.25, r / 80));
              at(d, x, y, () => {
                const Ro = r * 1.5;
                const g = d.createRadialGradient(0, 0, 0, 0, 0, Ro);
                for (const [rho, h] of PROFILE) {
                  const v = Math.round(127.5 + 127.5 * amp * h);
                  g.addColorStop(rho / 1.5, `rgb(${v},${v},${v})`);
                }
                g.addColorStop(1, "rgba(128,128,128,0)");
                d.fillStyle = g;
                d.beginPath();
                d.arc(0, 0, Ro, 0, Math.PI * 2);
                d.fill();
              });
            }
          }
        }
        // 거친 알갱이 노이즈
        for (const [ctx, w, h, amt] of [
          [c, W, H, 22],
          [b, W * K, H * K, 60],
        ]) {
          const img = ctx.getImageData(0, 0, w, h),
            dd = img.data;
          for (let i = 0; i < dd.length; i += 4) {
            const n = (Math.random() - 0.5) * amt;
            dd[i] += n;
            dd[i + 1] += n;
            dd[i + 2] += n;
          }
          ctx.putImageData(img, 0, 0);
        }
        heightMap = {
          data: d.getImageData(0, 0, dc.width, dc.height).data,
          w: dc.width,
          h: dc.height,
        };
        const aniso = renderer.capabilities.getMaxAnisotropy();
        const mk = (cv) => {
          const t = new THREE.CanvasTexture(cv);
          t.wrapS = t.wrapT = THREE.RepeatWrapping;
          t.anisotropy = aniso;
          return t;
        };
        const map = mk(cc);
        map.colorSpace = THREE.SRGBColorSpace;
        const disp = mk(dc);
        disp.generateMipmaps = false;
        disp.minFilter = THREE.LinearFilter;
        disp.anisotropy = 1;
        return { map, bump: mk(bc), disp };
      }
      const moon = makeMoonTextures();

      // 월드 방향 n 아래의 지형 높이 (변위 맵과 같은 좌표 계산)
      function heightAt(n) {
        if (!heightMap) return 0;
        const lx = n.x,
          ly = n.z,
          lz = -n.y; // 행성 메시의 로컬 좌표 (x축 90° 회전 보정)
        const th = Math.acos(THREE.MathUtils.clamp(ly, -1, 1));
        let ph = Math.atan2(lz, -lx);
        if (ph < 0) ph += Math.PI * 2;
        const { data, w, h } = heightMap;
        const fx = (ph / (Math.PI * 2)) * w - 0.5,
          fy = (th / Math.PI) * h - 0.5;
        const x0 = Math.floor(fx),
          y0 = Math.floor(fy),
          tx = fx - x0,
          ty = fy - y0;
        const px = (xx, yy) =>
          data[
            (Math.min(h - 1, Math.max(0, yy)) * w + (((xx % w) + w) % w)) * 4
          ];
        const v =
          (px(x0, y0) * (1 - tx) + px(x0 + 1, y0) * tx) * (1 - ty) +
          (px(x0, y0 + 1) * (1 - tx) + px(x0 + 1, y0 + 1) * tx) * ty;
        return (v / 255 - 128 / 255) * DISP;
      }

      const planetMat = new THREE.MeshStandardMaterial({
        map: moon.map,
        bumpMap: moon.bump,
        bumpScale: 2.5,
        displacementMap: moon.disp,
        displacementScale: DISP,
        displacementBias: -(128 / 255) * DISP,
        color: 0xfaecc5,
        roughness: 0.95,
        metalness: 0,
      });
      // 가까이서 봐도 거칠게 보이도록 같은 텍스처를 잘게 한 번 더 겹침
      planetMat.onBeforeCompile = (sh) => {
        sh.fragmentShader = sh.fragmentShader.replace(
          "#include <map_fragment>",
          "#include <map_fragment>\n diffuseColor.rgb *= 0.78 + 0.22 * texture2D(map, vMapUv * 13.0).r;",
        );
      };
      const planet = new THREE.Mesh(
        new THREE.SphereGeometry(R, 720, 360),
        planetMat,
      );
      planet.position.copy(C);
      planet.rotation.x = Math.PI / 2; // 구의 극점(텍스처 왜곡)이 캐릭터 시작 위치에서 벗어나도록
      scene.add(planet);

      /* ---------- Orbit by dragging left/right ---------- */
      let yaw = 0,
        yawTarget = 0,
        pitch = 0.22,
        pitchTarget = 0.22,
        camDist = 11;
      const PITCH_MIN = 0,
        PITCH_MAX = 1.35;
      let focusH = 0; // 캐릭터 발밑 지형 높이 (부드럽게)
      const focusN = V(0, 1, 0); // 캐릭터 발밑의 (부드럽게 따라가는) 지면 법선
      const refDir = V(0, 0, 1); // 평행 이동되는 기준 접선 방향
      const xAx = V(1, 0, 0),
        zAx = V(0, 0, 1);
      const target = V(0, 2.3, 0);
      const camOff = V(0, 0, 0);
      function updateFrame(selfN, selfH, dt) {
        focusH += (selfH - focusH) * Math.min(1, dt * 6);
        focusN.lerp(selfN, Math.min(1, dt * 6)).normalize();
        refDir.addScaledVector(focusN, -refDir.dot(focusN)).normalize();
        zAx.copy(refDir);
        xAx.crossVectors(focusN, zAx).normalize();
      }
      function updateCamera() {
        yaw += (yawTarget - yaw) * 0.18;
        pitch += (pitchTarget - pitch) * 0.18;
        const cp = Math.cos(pitch);
        camOff
          .set(0, 0, 0)
          .addScaledVector(xAx, Math.sin(yaw) * cp)
          .addScaledVector(zAx, Math.cos(yaw) * cp)
          .addScaledVector(focusN, Math.sin(pitch))
          .multiplyScalar(camDist);
        target.copy(C).addScaledVector(focusN, R + focusH + 1.1);
        camera.position.copy(target).add(camOff);
        camera.up.copy(focusN);
        camera.lookAt(target);
      }
      function followLights(t) {
        key.position
          .copy(target)
          .addScaledVector(xAx, 11)
          .addScaledVector(focusN, 20)
          .addScaledVector(zAx, 13);
        key.target.position.copy(target);
        rim.position
          .copy(target)
          .addScaledVector(xAx, -13)
          .addScaledVector(focusN, 7)
          .addScaledVector(zAx, -17);
        rim.target.position.copy(target);
        starGroups.forEach((g, i) => {
          g.material.opacity =
            0.78 + 0.22 * Math.sin(t * (1.1 + i * 0.5) + i * 2);
        });
      }
      let dragging = false,
        lastX = 0,
        lastY = 0;
      const cv = renderer.domElement;
      let moved = 0;
      cv.addEventListener("pointerdown", (e) => {
        moved = 0;
        dragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
        cv.setPointerCapture(e.pointerId);
        cv.classList.add("dragging");
      });
      cv.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        moved += Math.abs(e.clientX - lastX) + Math.abs(e.clientY - lastY);
        yawTarget -= (e.clientX - lastX) * 0.007; // 오른쪽으로 끌면 화면이 오른쪽으로 돌아감
        pitchTarget = Math.min(
          PITCH_MAX,
          Math.max(PITCH_MIN, pitchTarget + (e.clientY - lastY) * 0.006),
        ); // 아래로 끌면 위에서 내려다봄
        lastX = e.clientX;
        lastY = e.clientY;
      });
      const endDrag = () => {
        dragging = false;
        cv.classList.remove("dragging");
      };
      const ray = new THREE.Raycaster();
      const planetSphere = new THREE.Sphere(C, R);
      cv.addEventListener("pointerup", (e) => {
        const wasClick = dragging && moved < 8;
        endDrag();
        if (!wasClick) return;
        ray.setFromCamera(
          new THREE.Vector2(
            (e.clientX / innerWidth) * 2 - 1,
            -(e.clientY / innerHeight) * 2 + 1,
          ),
          camera,
        );
        const hit = new THREE.Vector3();
        if (!ray.ray.intersectSphere(planetSphere, hit)) return;
        moveSelf(hit.sub(C).normalize());
      });
      cv.addEventListener("pointercancel", endDrag);

      /* ---------- Character ---------- */
      const mats = {
        skin: new THREE.MeshStandardMaterial({
          color: 0xf6c49a,
          roughness: 0.65,
        }),
        suit: new THREE.MeshStandardMaterial({
          color: 0xb2d89c,
          roughness: 0.75,
        }),
        suit2: new THREE.MeshStandardMaterial({
          color: 0x8dbb78,
          roughness: 0.8,
        }),
        hair: new THREE.MeshStandardMaterial({
          color: 0xf0a52e,
          roughness: 0.6,
        }),
        hair2: new THREE.MeshStandardMaterial({
          color: 0xffc64a,
          roughness: 0.6,
        }),
        white: new THREE.MeshStandardMaterial({
          color: 0xffffff,
          roughness: 0.5,
        }),
        eye: new THREE.MeshStandardMaterial({
          color: 0x4a2230,
          roughness: 0.3,
        }),
        shoe: new THREE.MeshStandardMaterial({
          color: 0x4a3c34,
          roughness: 0.65,
        }),
        brow: new THREE.MeshStandardMaterial({
          color: 0x6b4430,
          roughness: 0.6,
        }),
        brown: new THREE.MeshStandardMaterial({
          color: 0x8a4e2c,
          roughness: 0.6,
        }),
        bow: new THREE.MeshStandardMaterial({
          color: 0xd62d2d,
          roughness: 0.5,
        }),
        scarf: new THREE.MeshStandardMaterial({
          color: 0xf4b02a,
          roughness: 0.7,
          side: THREE.DoubleSide,
        }),
      };
      // 캐릭터가 어둡지 않도록 자체 발광을 더해 밝게
      for (const k of [
        "skin",
        "suit",
        "suit2",
        "hair",
        "hair2",
        "white",
        "brown",
        "bow",
        "scarf",
      ]) {
        mats[k].emissive.copy(mats[k].color);
        mats[k].emissiveIntensity = 0.45;
      }
      mats.shoe.emissive.copy(mats.shoe.color);
      mats.shoe.emissiveIntensity = 0.3;

      function mesh(geo, mat, pos, scale, parent) {
        const m = new THREE.Mesh(geo, mat);
        if (pos) m.position.set(...pos);
        if (scale) m.scale.set(...scale);
        parent.add(m);
        return m;
      }
      const sph = new THREE.SphereGeometry(1, 32, 24);
      const cyl = (r1, r2 = r1) => new THREE.CylinderGeometry(r1, r2, 1, 20);

      function makeLabel(text) {
        const c = document.createElement("canvas");
        c.width = 512;
        c.height = 128;
        const g = c.getContext("2d");
        g.fillStyle = "rgba(0,0,0,.35)";
        g.beginPath();
        g.roundRect(0, 16, 512, 96, 48);
        g.fill();
        g.fillStyle = "#fff";
        g.font = "bold 60px sans-serif";
        g.textAlign = "center";
        g.textBaseline = "middle";
        g.fillText(text, 256, 66);
        const s = new THREE.Sprite(
          new THREE.SpriteMaterial({
            map: new THREE.CanvasTexture(c),
            transparent: true,
            depthWrite: false,
          }),
        );
        s.scale.set(3.0, 0.75, 1); // 글씨 200%
        return s;
      }

      const UP = V(0, 1, 0);
      function setLimb(m, a, b) {
        const d = b.clone().sub(a),
          len = d.length();
        m.position.copy(a).addScaledVector(d, 0.5);
        m.scale.set(1, len, 1);
        m.quaternion.setFromUnitVectors(UP, d.normalize());
      }

      function makeArm(root, side, S, restE, restH) {
        // 단순한 팔: 어깨~팔꿈치는 소매색 원기둥 하나, 아래팔은 원기둥, 끝은 손
        return {
          side,
          S,
          restE,
          restH,
          upper: mesh(cyl(0.2), mats.suit, null, null, root),
          fore: mesh(cyl(0.16, 0.14), mats.skin, null, null, root),
          hand: mesh(sph, mats.skin, null, [0.2, 0.19, 0.2], root),
        };
      }
      function poseArm(arm, E, H) {
        setLimb(arm.upper, arm.S, E);
        setLimb(arm.fore, E, H);
        arm.hand.position.copy(H);
      }

      function makeCharacter(label) {
        const root = new THREE.Group();

        // shadow
        const sh = new THREE.Mesh(
          new THREE.CircleGeometry(1.1, 32),
          new THREE.MeshBasicMaterial({
            color: 0x000020,
            transparent: true,
            opacity: 0.14,
            depthWrite: false,
          }),
        );
        sh.rotation.x = -Math.PI / 2;
        sh.position.y = 0.01;
        root.add(sh);

        // legs (hip pivot at y=1.9 so they can swing while walking)
        const legs = [];
        for (const x of [-0.3, 0.3]) {
          const leg = new THREE.Group();
          leg.position.set(x, 1.9, 0);
          root.add(leg);
          const Y = 1.9;
          mesh(
            new THREE.CylinderGeometry(0.3, 0.4, 1, 24),
            mats.suit,
            [0, 1.05 - Y, 0],
            [1, 1.75, 1],
            leg,
          ); // 아래로 넓게 퍼지는 바지
          mesh(sph, mats.shoe, [0, 0.12 - Y, 0.17], [0.2, 0.11, 0.44], leg); // 뾰족한 신발
          legs.push(leg);
        }

        // hips + torso (jumpsuit)
        mesh(sph, mats.suit, [0, 1.95, 0], [0.68, 0.4, 0.5], root);
        mesh(
          new THREE.CapsuleGeometry(1, 0.9, 8, 28),
          mats.suit,
          [0, 2.55, 0],
          [0.58 * 1.2, 0.6, 0.58 * 0.8],
          root,
        );
        for (const by of [2.95, 2.72, 2.49])
          mesh(sph, mats.brown, [0, by, 0.47], [0.045, 0.045, 0.03], root); // 단추
        const belt = new THREE.Mesh(
          new THREE.TorusGeometry(1, 0.06, 8, 40),
          mats.brown,
        ); // 갈색 허리띠
        belt.rotation.x = Math.PI / 2;
        belt.scale.set(0.72, 0.48, 1);
        belt.position.set(0, 2.2, 0);
        root.add(belt);
        // 목에 두른 황금빛 스카프 (겹쳐 감은 모양 + 앞쪽 매듭)
        for (const [sy, sr, tube, sx, sz] of [
          [3.1, 0.42, 0.11, 1.45, 1.12],
          [3.26, 0.3, 0.13, 1.45, 1.1],
        ]) {
          const wrap = new THREE.Mesh(
            new THREE.TorusGeometry(sr, tube, 12, 40),
            mats.scarf,
          );
          wrap.rotation.x = Math.PI / 2;
          wrap.scale.set(sx, sz, 1);
          wrap.position.set(0, sy, 0);
          root.add(wrap);
        }
        mesh(sph, mats.scarf, [0.12, 3.08, 0.4], [0.17, 0.2, 0.1], root);
        // 바람에 날리는 긴 스카프 자락
        const scarfTail = new THREE.Group();
        scarfTail.position.set(0.05, 3.3, -0.28);
        root.add(scarfTail);
        {
          const curve = new THREE.CatmullRomCurve3([
            V(0, 0, 0),
            V(-0.5, 0.1, -0.12),
            V(-1.1, -0.05, -0.3),
            V(-1.7, 0.22, -0.4),
            V(-2.3, 0.05, -0.6),
          ]);
          const N = 48,
            pos = [],
            idx = [];
          for (let i = 0; i <= N; i++) {
            const u = i / N,
              pt = curve.getPoint(u),
              T = curve.getTangent(u);
            const w = new THREE.Vector3().crossVectors(T, V(0, 0, 1));
            if (w.lengthSq() < 1e-6) w.set(0, 1, 0);
            w.normalize();
            const hw = 0.19 - 0.06 * u;
            pos.push(
              pt.x + w.x * hw,
              pt.y + w.y * hw,
              pt.z + w.z * hw,
              pt.x - w.x * hw,
              pt.y - w.y * hw,
              pt.z - w.z * hw,
            );
            if (i < N) {
              const a = i * 2;
              idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
            }
          }
          const g = new THREE.BufferGeometry();
          g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
          g.setIndex(idx);
          g.computeVertexNormals();
          scarfTail.add(new THREE.Mesh(g, mats.scarf));
        }
        mesh(cyl(0.2), mats.skin, [0, 3.3, 0], [1, 0.3, 1], root); // neck

        // arms (crossed)
        const armR = makeArm(
          root,
          1,
          V(0.72, 3.0, 0),
          V(0.82, 2.4, 0.02),
          V(0.86, 1.8, 0.05),
        );
        const armL = makeArm(
          root,
          -1,
          V(-0.72, 3.0, 0),
          V(-0.82, 2.4, 0.02),
          V(-0.86, 1.8, 0.05),
        );
        poseArm(armL, armL.restE, armL.restH);
        poseArm(armR, armR.restE, armR.restH);

        // head
        const head = new THREE.Group();
        head.position.set(0, 3.75, 0);
        root.add(head);
        mesh(sph, mats.skin, null, [0.68, 0.62, 0.62], head);
        for (const s of [-1, 1])
          mesh(sph, mats.skin, [s * 0.66, -0.03, 0], [0.1, 0.14, 0.1], head); // ears

        // hair: cap + swoop + side
        const cap = mesh(
          new THREE.SphereGeometry(1, 48, 28, 0, Math.PI * 2, 0, Math.PI * 0.6),
          mats.hair,
          [0, 0.04, -0.04],
          [0.71, 0.67, 0.67],
          head,
        );
        cap.rotation.x = -0.28;
        // 튀어나온 부분 없이 매끈하고 둥근 머리

        // face
        for (const s of [-1, 1]) {
          mesh(
            sph,
            mats.white,
            [s * 0.24, -0.03, 0.56],
            [0.12, 0.135, 0.06],
            head,
          ); // 작아진 눈
          mesh(
            sph,
            mats.eye,
            [s * 0.235, -0.03, 0.6],
            [0.085, 0.1, 0.045],
            head,
          );
          mesh(
            sph,
            mats.white,
            [s * 0.235 + 0.028, 0.012, 0.64],
            [0.026, 0.026, 0.016],
            head,
          );
          const brow = mesh(
            new THREE.CapsuleGeometry(0.018, 0.12, 4, 8),
            mats.brow,
            [s * 0.25, 0.22, 0.52],
            null,
            head,
          );
          brow.rotation.z = Math.PI / 2 - s * 0.28; // 바깥쪽이 살짝 처진 눈썹
        }
        const mouth = new THREE.Mesh(
          new THREE.CapsuleGeometry(0.014, 0.12, 4, 8),
          mats.eye,
        ); // 일자 입
        mouth.rotation.z = Math.PI / 2;
        mouth.position.set(0, -0.3, 0.55);
        head.add(mouth);

        const tag = makeLabel(label);
        tag.position.y = 5.1;
        root.add(tag);

        return {
          root,
          head,
          armR,
          armL,
          legs,
          scarfTail,
          dest: null,
          walkAmt: 0,
          phase: 0,
          n: V(0, 1, 0),
          fwd: V(0, 0, 1),
          lift: 0,
          h: 0,
        };
      }

      /* ---------- Players ---------- */
      const players = new Map();
      const _bas = new THREE.Matrix4(),
        _bx = V(0, 0, 0),
        _axis = V(0, 0, 0),
        _des = V(0, 0, 0),
        _q = new THREE.Quaternion();
      function placeChar(ch) {
        ch.n.normalize();
        ch.fwd.addScaledVector(ch.n, -ch.fwd.dot(ch.n));
        if (ch.fwd.lengthSq() < 1e-6)
          ch.fwd.set(0, 0, 1).addScaledVector(ch.n, -ch.n.z);
        if (ch.fwd.lengthSq() < 1e-6)
          ch.fwd.set(1, 0, 0).addScaledVector(ch.n, -ch.n.x);
        ch.fwd.normalize();
        _bx.crossVectors(ch.n, ch.fwd).normalize();
        _bas.makeBasis(_bx, ch.n, ch.fwd);
        ch.root.quaternion.setFromRotationMatrix(_bas);
        ch.h = heightAt(ch.n);
        ch.root.position.copy(C).addScaledVector(ch.n, R + ch.h + ch.lift);
      }
      // 아름다운 순우리말 이름 (접속 ID로 정해져서 모든 접속자 화면에서 같은 이름으로 보임)
      const KOREAN_NAMES = [
        "가온",
        "나래",
        "다솜",
        "라온",
        "마루",
        "보람",
        "슬기",
        "아라",
        "여울",
        "이슬",
        "하늘",
        "한울",
        "해솔",
        "새봄",
        "소담",
        "초롱",
        "푸름",
        "별아",
        "달래",
        "보라",
        "다온",
        "나리",
        "가람",
        "그린",
        "노을",
        "늘봄",
        "단비",
        "미르",
        "샛별",
        "아름",
        "하람",
        "해든",
        "한결",
        "윤슬",
        "온새미",
        "은빛",
        "꽃님",
        "구슬",
        "다정",
        "솔빛",
      ];
      function nameFor(id) {
        let h = 7;
        for (const ch of id) h = (h * 131 + ch.charCodeAt(0)) >>> 0;
        return KOREAN_NAMES[h % KOREAN_NAMES.length];
      }
      function spawnPos(id) {
        let h = 0;
        for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
        return [((h % 9) - 4) * 0.9, ((h >> 4) % 3) * 0.8];
      }
      function addPlayer(id, label) {
        if (players.has(id)) return players.get(id);
        const ch = makeCharacter(label);
        const [x, z] = spawnPos(id);
        ch.n.set(x, R, z).normalize();
        ch.root.scale.setScalar((2 / 3) * 0.7); // 70%로 축소
        placeChar(ch);
        scene.add(ch.root);
        players.set(id, ch);
        return ch;
      }
      function removePlayer(id) {
        const ch = players.get(id);
        if (!ch) return;
        scene.remove(ch.root);
        players.delete(id);
      }
      function layout() {
        const aspect = innerWidth / innerHeight;
        const tanV = Math.tan(THREE.MathUtils.degToRad(22.5));
        camDist = Math.max(3.0 / tanV, 2.8 / (tanV * aspect)) + 2;
      }
      layout();

      /* ---------- 바닥에 핀 장미 한 송이 ---------- */
      const roseRoot = new THREE.Group();
      const roseHead = new THREE.Group();
      {
        const reds = [0x7a0820, 0x9c0c2c, 0xc4153c, 0xe0204a].map(
          (c) =>
            new THREE.MeshStandardMaterial({
              color: c,
              roughness: 0.45,
              emissive: c,
              emissiveIntensity: 0.12,
            }),
        );
        const green = new THREE.MeshStandardMaterial({
          color: 0x2f9a3f,
          roughness: 0.6,
        });
        const leafMat = new THREE.MeshStandardMaterial({
          color: 0x3aae4a,
          roughness: 0.55,
        });
        const rose = new THREE.Group();
        rose.rotation.z = 0.06;
        roseRoot.add(rose);

        mesh(cyl(0.04, 0.055), green, [0, 0.45, 0], [1, 0.9, 1], rose); // 줄기
        const l1 = mesh(
          sph,
          leafMat,
          [0.15, 0.32, 0],
          [0.16, 0.025, 0.07],
          rose,
        );
        l1.rotation.z = 0.35; // 잎
        const l2 = mesh(
          sph,
          leafMat,
          [-0.13, 0.55, 0.03],
          [0.15, 0.025, 0.065],
          rose,
        );
        l2.rotation.z = -0.4;
        const sh = new THREE.Mesh(
          new THREE.CircleGeometry(0.4, 24),
          new THREE.MeshBasicMaterial({
            color: 0x000020,
            transparent: true,
            opacity: 0.14,
            depthWrite: false,
          }),
        );
        sh.rotation.x = -Math.PI / 2;
        sh.position.y = 0.03;
        roseRoot.add(sh);

        rose.add(roseHead);
        roseHead.position.y = 0.92;
        roseHead.scale.setScalar(0.75);
        // 꽃받침
        for (let i = 0; i < 5; i++) {
          const a = (i / 5) * Math.PI * 2;
          const sp = mesh(
            new THREE.ConeGeometry(0.04, 0.16, 6),
            green,
            [Math.cos(a) * 0.09, -0.05, Math.sin(a) * 0.09],
            null,
            roseHead,
          );
          sp.rotation.order = "YXZ";
          sp.rotation.y = Math.PI / 2 - a;
          sp.rotation.x = 2.3;
        }
        // 꽃잎: 안쪽은 오므리고 바깥쪽은 활짝 벌어지게 겹겹이
        mesh(sph, reds[0], [0, 0.1, 0], [0.09, 0.1, 0.09], roseHead); // 꽃봉오리 중심
        const layers = [
          // [개수, 반지름, 높이, 기울기, 폭, 높이, 두께, 재질, 각도 오프셋]
          [5, 0.09, 0.13, -0.05, 0.08, 0.16, 0.03, reds[0], 0],
          [6, 0.15, 0.11, 0.2, 0.1, 0.17, 0.035, reds[1], Math.PI / 6],
          [7, 0.21, 0.08, 0.55, 0.12, 0.17, 0.04, reds[2], 0.2],
          [8, 0.26, 0.04, 0.9, 0.13, 0.15, 0.04, reds[3], 0.5],
        ];
        for (const [n, rho, y, tilt, w, h, t, mat, off] of layers) {
          for (let i = 0; i < n; i++) {
            const a = (i / n) * Math.PI * 2 + off;
            const pt = mesh(
              sph,
              mat,
              [Math.cos(a) * rho, y, Math.sin(a) * rho],
              [w, h, t],
              roseHead,
            );
            pt.rotation.order = "YXZ";
            pt.rotation.y = Math.PI / 2 - a;
            pt.rotation.x = tilt;
          }
        }
      }
      {
        // 투명한 유리 덮개 + 작은 나무 받침
        const pts = [];
        pts.push(new THREE.Vector2(0.5, 0.05), new THREE.Vector2(0.5, 0.95));
        for (let i = 1; i <= 16; i++) {
          const a = ((i / 16) * Math.PI) / 2;
          pts.push(
            new THREE.Vector2(0.5 * Math.cos(a), 0.95 + 0.62 * Math.sin(a)),
          );
        }
        const glass = new THREE.Mesh(
          new THREE.LatheGeometry(pts, 48),
          new THREE.ShaderMaterial({
            // 가운데는 완전 투명, 가장자리(윤곽)만 밝게
            vertexShader:
              "varying vec3 vN; varying vec3 vV; void main(){ vN = normalize(normalMatrix * normal); vec4 mv = modelViewMatrix * vec4(position, 1.0); vV = -mv.xyz; gl_Position = projectionMatrix * mv; }",
            fragmentShader:
              "varying vec3 vN; varying vec3 vV; void main(){ float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 2.2); gl_FragColor = vec4(0.52, 0.54, 0.58, clamp(0.07 + f * 0.75, 0.0, 1.0)); }",
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false,
          }),
        );
        glass.renderOrder = 2;
        roseRoot.add(glass);
        const baseDisc = new THREE.Mesh(
          new THREE.CylinderGeometry(0.56, 0.6, 0.08, 40),
          new THREE.MeshStandardMaterial({ color: 0xb98a56, roughness: 0.7 }),
        );
        baseDisc.position.y = 0.02;
        roseRoot.add(baseDisc);
      }
      const roseN = V(-2.6, R, -2.8).normalize(); // 장미(유리관) 위치
      {
        const n = roseN; // 캐릭터 시작 위치 근처, 처음 화면에 보이는 자리
        roseRoot.position.copy(C).addScaledVector(n, R + heightAt(n) - 0.02);
        roseRoot.quaternion.setFromUnitVectors(V(0, 1, 0), n);
        scene.add(roseRoot);
      }

      /* ---------- 유리관 충돌: 통과하지 못하고 돌아서 감 ---------- */
      const GLASS_BLOCK_R = 0.87; // 유리 받침 반지름 + 캐릭터 몸 반경
      const glassRho = GLASS_BLOCK_R / R;
      const _cand = V(0, 0, 0),
        _rel = V(0, 0, 0),
        _tmp = V(0, 0, 0),
        _qs = new THREE.Quaternion();
      function blocked(n) {
        return Math.acos(THREE.MathUtils.clamp(n.dot(roseN), -1, 1)) < glassRho;
      }
      function clampDest(d) {
        // 목적지가 유리관 안이면 가장자리로 옮김
        if (!blocked(d)) return d;
        const t = d.clone().addScaledVector(roseN, -d.dot(roseN));
        if (t.lengthSq() < 1e-12)
          t.set(1, 0, 0).addScaledVector(roseN, -roseN.x);
        t.normalize();
        return roseN
          .clone()
          .multiplyScalar(Math.cos(glassRho * 1.03))
          .addScaledVector(t, Math.sin(glassRho * 1.03));
      }
      function slideAround(ch, step) {
        // 유리관 둘레를 따라 목적지에 가까운 쪽으로 미끄러짐
        const rho = glassRho * 1.01;
        _rel.copy(ch.n).addScaledVector(roseN, -ch.n.dot(roseN));
        if (_rel.lengthSq() < 1e-12)
          _rel.set(1, 0, 0).addScaledVector(roseN, -roseN.x);
        _rel.normalize();
        const dpsi = (step * R) / GLASS_BLOCK_R;
        let best = null,
          bestDot = -2;
        for (const sg of [1, -1]) {
          _qs.setFromAxisAngle(roseN, sg * dpsi);
          _tmp.copy(_rel).applyQuaternion(_qs);
          _cand
            .copy(roseN)
            .multiplyScalar(Math.cos(rho))
            .addScaledVector(_tmp, Math.sin(rho));
          const dd = _cand.dot(ch.dest);
          if (dd > bestDot) {
            bestDot = dd;
            best = _cand.clone();
          }
        }
        _des.copy(best).addScaledVector(ch.n, -best.dot(ch.n));
        if (_des.lengthSq() > 1e-12) {
          _des.normalize();
          ch.fwd.lerp(_des, 0.5);
        }
        ch.n.copy(best);
      }

      addPlayer(selfId, nameFor(selfId));

      /* ---------- Click marker ---------- */
      const marker = new THREE.Mesh(
        new THREE.RingGeometry(0.35, 0.5, 32),
        new THREE.MeshBasicMaterial({
          color: 0xdcdcdc,
          transparent: true,
          opacity: 0,
          depthWrite: false,
          side: THREE.DoubleSide,
        }),
      );
      scene.add(marker);
      let markerT0 = -1e9;

      function stateOf(id) {
        const ch = players.get(id);
        return { n: ch.n.toArray(), d: ch.dest ? ch.dest.toArray() : null };
      }
      let sendState = null;
      function moveSelf(tn) {
        const ch = players.get(selfId);
        const dn = clampDest(tn.clone());
        ch.dest = dn;
        marker.position.copy(C).addScaledVector(dn, R + heightAt(dn) + 0.2);
        marker.quaternion.setFromUnitVectors(V(0, 0, 1), dn);
        markerT0 = performance.now();
        if (sendState) sendState(stateOf(selfId));
      }

      /* ---------- 장미의 비밀 ---------- */
      const bubble = document.getElementById("roseBubble");
      const modal = document.getElementById("secretModal");
      const secretText = document.getElementById("secretText");
      let roseState = "idle"; // 'idle' | 'prompt' | 'write'
      let roseArmed = true; // 장미에서 멀어졌다가 다시 다가와야 팝업이 다시 뜸
      const NEAR = 3.2,
        REARM = 3.8,
        FAR_CLOSE = 7; // 장미에 다가갈 때마다 팝업 (조금만 멀어졌다 와도 다시 뜸)

      // 장미 위에 생겼다 사라지는 빛
      const roseGlow = (() => {
        const c = document.createElement("canvas");
        c.width = c.height = 128;
        const g = c.getContext("2d");
        const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
        gr.addColorStop(0, "rgba(255,250,225,1)");
        gr.addColorStop(0.25, "rgba(255,236,170,0.7)");
        gr.addColorStop(0.6, "rgba(255,214,120,0.18)");
        gr.addColorStop(1, "rgba(255,200,100,0)");
        g.fillStyle = gr;
        g.fillRect(0, 0, 128, 128);
        const sp = new THREE.Sprite(
          new THREE.SpriteMaterial({
            map: new THREE.CanvasTexture(c),
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            opacity: 0,
          }),
        );
        sp.position.set(0, 1.15, 0);
        roseRoot.add(sp);
        return sp;
      })();
      const roseLight = new THREE.PointLight(0xffe9a8, 0, 7);
      roseLight.position.set(0, 1.2, 0);
      roseRoot.add(roseLight);
      let glowT0 = -1e9;
      const GLOW_MS = 2600;
      function startGlow() {
        glowT0 = performance.now();
      }

      const _wp = V(0, 0, 0);
      function placeBubble() {
        // 팝업을 장미 위 화면 좌표에 붙임
        roseRoot.localToWorld(_wp.set(0, 1.75, 0));
        _wp.project(camera);
        if (_wp.z > 1) {
          bubble.style.visibility = "hidden";
          return;
        }
        bubble.style.visibility = "visible";
        const w = bubble.offsetWidth,
          h = bubble.offsetHeight;
        let x = (_wp.x * 0.5 + 0.5) * innerWidth,
          y = (-_wp.y * 0.5 + 0.5) * innerHeight - 6;
        x = Math.min(innerWidth - w / 2 - 8, Math.max(w / 2 + 8, x));
        y = Math.max(h + 8, y);
        bubble.style.left = x + "px";
        bubble.style.top = y + "px";
      }
      function saveSecret(text) {
        // 이 기기(내 브라우저)에만 저장, 네트워크로는 절대 보내지 않음
        try {
          const arr = JSON.parse(localStorage.getItem("rose-secrets") || "[]");
          arr.push({ t: Date.now(), text });
          localStorage.setItem("rose-secrets", JSON.stringify(arr));
        } catch (e) {
          /* 저장 불가 환경이면 무시 */
        }
      }
      document.getElementById("secretCancel").addEventListener("click", () => {
        bubble.hidden = true;
        roseState = "idle"; // 취소: 빛 없이 닫기만 함
      });
      document.getElementById("secretWrite").addEventListener("click", () => {
        bubble.hidden = true;
        roseState = "write";
        secretText.value = "";
        modal.hidden = false;
        setTimeout(() => secretText.focus(), 50);
      });
      document.getElementById("secretOk").addEventListener("click", () => {
        const text = secretText.value.trim();
        if (text) saveSecret(text);
        secretText.value = "";
        modal.hidden = true;
        roseState = "idle";
        startGlow();
      });

      function roseInteract(now, me) {
        const d = Math.acos(THREE.MathUtils.clamp(me.n.dot(roseN), -1, 1)) * R; // 장미까지의 표면 거리
        if (roseState === "idle") {
          if (d > REARM) roseArmed = true;
          if (roseArmed && d < NEAR) {
            roseArmed = false;
            roseState = "prompt";
            bubble.hidden = false;
            placeBubble();
          }
        } else if (roseState === "prompt") {
          if (d > FAR_CLOSE) {
            bubble.hidden = true;
            roseState = "idle";
          } // 멀리 가면 조용히 닫힘
          else placeBubble();
        }
        const k = (now - glowT0) / GLOW_MS; // 빛이 생겼다 사라짐
        if (k >= 0 && k < 1) {
          const env = Math.sin(Math.PI * k);
          roseGlow.material.opacity = env;
          roseGlow.scale.setScalar(1.0 + 1.6 * env);
          roseGlow.position.y = 1.15 + 0.4 * k;
          roseLight.intensity = 8 * env;
        } else {
          roseGlow.material.opacity = 0;
          roseLight.intensity = 0;
        }
      }

      /* ---------- 나가기 (왼쪽 위 X 버튼) ---------- */
      document.getElementById("exitBtn").addEventListener("click", () => {
        window.close(); // 스크립트로 열린 창/앱에서는 바로 닫힘
        setTimeout(() => {
          location.replace("about:blank");
        }, 200); // 브라우저가 닫기를 막는 경우: 빈 화면으로 나감
      });

      /* ---------- Animation ---------- */

      const _e = V(0, 0, 0),
        _h = V(0, 0, 0);
      function rotX(v, th) {
        const c = Math.cos(th),
          sn = Math.sin(th);
        const y = v.y * c - v.z * sn,
          z = v.y * sn + v.z * c;
        v.y = y;
        v.z = z;
        return v;
      }
      let prev = performance.now();
      function animate(now) {
        const t = now / 1000;
        const dt = Math.min(0.05, (now - prev) / 1000);
        prev = now;
        for (const [id, ch] of players) {
          // walking toward destination along the planet surface (great circle)
          let moving = false;
          if (ch.dest) {
            const ang = Math.acos(
              THREE.MathUtils.clamp(ch.n.dot(ch.dest), -1, 1),
            );
            if (ang * R > 0.05) {
              const step = Math.min(ang, (1.5 * dt) / R);
              _axis.crossVectors(ch.n, ch.dest);
              if (_axis.lengthSq() < 1e-10) _axis.crossVectors(ch.n, ch.fwd);
              _axis.normalize();
              _q.setFromAxisAngle(_axis, step);
              _des.copy(ch.dest).addScaledVector(ch.n, -ch.dest.dot(ch.n));
              if (_des.lengthSq() > 1e-12) _des.normalize();
              else _des.copy(ch.fwd);
              ch.fwd.lerp(_des, Math.min(1, dt * 12));
              if (ch.fwd.lengthSq() < 0.05) ch.fwd.copy(_des);
              _cand.copy(ch.n).applyQuaternion(_q);
              if (!blocked(_cand)) {
                ch.n.copy(_cand);
                ch.fwd.applyQuaternion(_q);
              } else slideAround(ch, step);
              moving = true;
            } else ch.dest = null;
          }
          ch.walkAmt += ((moving ? 1 : 0) - ch.walkAmt) * Math.min(1, dt * 10);
          if (moving) ch.phase += dt * 8;
          ch.legs[0].rotation.x = Math.sin(ch.phase) * 0.45 * ch.walkAmt;
          ch.legs[1].rotation.x = -Math.sin(ch.phase) * 0.45 * ch.walkAmt;
          ch.lift =
            Math.sin(t * 1.8 + id.charCodeAt(0)) * 0.025 * (1 - ch.walkAmt) +
            Math.abs(Math.sin(ch.phase)) * 0.09 * ch.walkAmt;
          placeChar(ch);
          ch.head.rotation.z =
            Math.sin(t * 1.2 + id.charCodeAt(1 % id.length)) * 0.02;
          ch.scarfTail.rotation.y =
            Math.sin(t * 2.4 + id.charCodeAt(0)) * 0.12 - ch.walkAmt * 0.18; // 스카프 자락이 펄럭임
          ch.scarfTail.rotation.z = Math.sin(t * 3.1 + 1) * 0.05;

          // 팔은 몸 옆으로 곧게, 걸을 때는 다리와 반대로 흔들림
          for (const a of [ch.armL, ch.armR]) {
            const th = a.side * Math.sin(ch.phase) * 0.5 * ch.walkAmt;
            _e.copy(a.restE).sub(a.S);
            rotX(_e, th);
            _e.add(a.S);
            _h.copy(a.restH).sub(a.S);
            rotX(_h, th);
            _h.add(a.S);
            poseArm(a, _e, _h);
          }
        }
        roseHead.rotation.z = Math.sin(t * 1.3) * 0.04; // 꽃이 살랑살랑
        roseHead.rotation.x = Math.sin(t * 0.9 + 1) * 0.03;
        const me = players.get(selfId);
        updateFrame(me.n, me.h, dt);
        roseInteract(now, me);
        const mk = (now - markerT0) / 900;
        marker.material.opacity = mk < 1 ? 0.9 * (1 - mk) : 0;
        marker.scale.setScalar(1 + mk * 0.8);
        updateCamera();
        followLights(t);
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);

      addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
        layout();
      });

      /* ---------- UI + Trystero (serverless P2P) ---------- */

      if (ENABLE_P2P && joinRoom)
        try {
          const roomId = location.hash.slice(1) || "neon-wave-room";
          const room = joinRoom({ appId: "neon-jumpsuit-wave-demo" }, roomId);
          const act = room.makeAction("state");

          const handleState = (d, id) => {
            const ch = addPlayer(id, nameFor(id));
            ch.n.fromArray(d.n);
            ch.dest = d.d
              ? clampDest(new THREE.Vector3().fromArray(d.d))
              : null;
          };
          const onJoin = (id) => {
            addPlayer(id, nameFor(id));
            sendState(stateOf(selfId), id);
          };
          const onLeave = (id) => removePlayer(id);

          if (Array.isArray(act)) {
            // 구버전 Trystero API: makeAction → [send, receive], room.onPeerJoin(fn)
            sendState = (d, id) => act[0](d, id);
            act[1](handleState);
            room.onPeerJoin(onJoin);
            room.onPeerLeave(onLeave);
          } else {
            // 신버전 Trystero API: makeAction → { send, onMessage }, room.onPeerJoin = fn
            sendState = (d, id) => act.send(d, id ? { target: id } : undefined);
            act.onMessage = (d, info) => handleState(d, info.peerId);
            room.onPeerJoin = onJoin;
            room.onPeerLeave = onLeave;
          }
        } catch (e) {
          console.error(e);
        }
    </script>
  </body>
</html>
